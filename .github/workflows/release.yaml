name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce moderngl pyinstaller numpy

      - name: Build with PyInstaller
        run: pyinstaller 90sgs.spec

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: 90sgs-windows
          path: dist/90sgs.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libgl1-mesa-dev libfuse2 python3-pil
          # python3-pil fornece o Pillow para gerar o ícone PNG

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce moderngl pyinstaller numpy

      - name: Build with PyInstaller
        run: pyinstaller 90sgs.spec

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp dist/90sgs AppDir/usr/bin/90sgs

          # Arquivo AppRun — OBRIGATÓRIO para o AppImage abrir
          cat > AppDir/AppRun <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/90sgs" "$@"
          EOF
          chmod +x AppDir/AppRun

          # Arquivo .desktop
          cat > AppDir/90sgs.desktop <<'EOF'
          [Desktop Entry]
          Name=90 Seconds
          Exec=90sgs
          Icon=90sgs
          Type=Application
          Categories=Game;
          EOF

          # Ícone PNG (gera um placeholder 256x256 com Pillow)
          python -c "from PIL import Image; Image.new('RGB', (256,256), color=(20,20,20)).save('AppDir/90sgs.png')"

      - name: Download appimagetool
        run: |
          wget -q -O appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Build AppImage
        run: |
          # --appimage-extract-and-run evita falha por FUSE ausente no runner
          ./appimagetool --appimage-extract-and-run AppDir 90sgs-x86_64.AppImage

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: 90sgs-linux
          path: 90sgs-x86_64.AppImage

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/90sgs-windows/90sgs.exe
            artifacts/90sgs-linux/90sgs-x86_64.AppImage
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
